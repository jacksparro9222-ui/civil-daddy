services:
  - type: web
    name: civil-daddy
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civil-daddy-db
          property: connectionString

databases:
  - name: civil-daddy-db
    region: singapore
    plan: free
    databaseName: civil_daddy
    user: civil_daddy
